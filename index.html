<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YüceSoy Nakliyat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; background: black; color: white; font-family: sans-serif; }
        .custom-video-mobile { width: 100%; height: auto; object-fit: contain; display: block; background: black; }
        header { position: relative; height: 80vh; min-height: 500px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #map-video-desktop { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .video-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 2; }
        #map-text { z-index: 10; position: relative; }
        @media (max-width: 768px) { header { display: none !important; } }
        @media (min-width: 769px) { .mobile-video-section { display: none !important; } }
    </style>
</head>
<body>
<div class="mobile-video-section container-fluid p-0">
    <video class="custom-video-mobile" autoplay loop muted playsinline><source src="a.img/oval-text.mp4" type="video/mp4"></video>
</div>
<header>
    <video autoplay muted loop playsinline id="map-video-desktop"><source src="a.img/vecteezy-bos.mp4" type="video/mp4"></video>
    <div class="video-overlay"></div>
    <div class="text-center px-4" id="map-text">
        <h2 class="tracking-[0.35em] text-gray-300 mb-3 my-5 text-sm md:text-xl uppercase">Türkiye'nin Dört Bir Yanına</h2>
        <h3 class="font-bold mb-4 text-xl md:text-2xl">GÜVENLİ TAŞIMACILIK</h3>
        <h1 class="display-1 fw-bold text-uppercase text-white" style="text-shadow: 0 0 20px rgba(37,99,235,0.6);">YÜCESOY NAKLİYAT</h1>
        <a href="tel:05324508754" class="btn btn-primary btn-lg mt-4 px-5 py-3 fw-bold">HIZLI TEKLİF AL (ARA)</a>
    </div>
</header>
</body>
</html>
